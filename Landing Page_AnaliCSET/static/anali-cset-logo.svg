<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="waveGradLogo" x1="40" y1="90" x2="160" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="35%" stop-color="#00e5ff" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="starGradLogo" x1="140" y1="20" x2="190" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Left Icon -->
  <g transform="translate(10, 5) scale(0.95)">
    <!-- Top bar -->
    <path d="M 65 42 L 126 42" stroke="#0066ff" stroke-width="12" stroke-linecap="round" />
    
    <!-- Right side -->
    <path d="M 152 70 L 152 124 Q 152 144 132 144 L 92 144" stroke="#0066ff" stroke-width="12" stroke-linecap="round" />

    <!-- Tail and lower left -->
    <path d="M 92 144 L 72 165 Q 64 172 63 158 L 63 144 Q 42 144 42 124 L 42 112" stroke="#0066ff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Upper left corner -->
    <path d="M 42 98 L 42 62 Q 42 42 62 42" stroke="#0066ff" stroke-width="12" stroke-linecap="round" />

    <!-- Sparkle Star -->
    <path d="M 148 24 Q 148 48 172 48 Q 148 48 148 72 Q 148 48 124 48 Q 148 48 148 24 Z" fill="url(#starGradLogo)" />

    <!-- Wave pulse -->
    <path d="M 54 100 L 70 100 Q 76 100 80 92 L 86 82 Q 91 74 96 90 L 108 126 Q 112 136 117 114 L 124 64 Q 128 50 132 76 L 138 108 Q 142 120 146 100 L 150 100" 
          stroke="url(#waveGradLogo)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Brand Typography: ANALI CSET -->
  <text x="210" y="112" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0b246a" letter-spacing="1">ANALI <tspan fill="#0050cb">CSET</tspan></text>
</svg>
